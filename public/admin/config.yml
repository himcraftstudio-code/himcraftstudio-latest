
backend:
  name: github
  repo: himcraftstudio-code/himcraftstudio-latest
  branch: main

media_folder: "public/images"
public_folder: "/images"

collections:
  - name: "products"
    label: "Products"
    files:
      - name: "product_data"
        label: "Product Data"
        file: "public/data/products.json"
        fields:
          - label: "Products"
            name: "products"
            widget: "list"
            fields:
              - label: "ID"
                name: "id"
                widget: "string"
                required: false
              - label: "Product Name"
                name: "name"
                widget: "string"
              - label: "Category"
                name: "category"
                widget: "select"
                options: ["Flowers", "Keychains", "Bags", "Winter", "Home Décor", "Custom"]
              - label: "Price"
                name: "price"
                widget: "string"
              - label: "Description"
                name: "description"
                widget: "text"
              - label: "Product Image"
                name: "image"
                widget: "image"
              - label: "More photos (optional)"
                name: "images"
                widget: "list"
                required: false
                hint: "Extra photos shown in the product gallery"
                field: {label: "Photo", name: "photo", widget: "image"}
