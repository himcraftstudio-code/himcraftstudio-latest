
backend:
  name: github
  repo: himcraftstudio-code/himcraftstudio-latest
  branch: main

media_folder: "public/images"
public_folder: "/images"

collections:
  - name: "products"
    label: "Products"
    folder: "public/products"
    create: true
    extension: "json"
    format: "json"
    slug: "{{slug}}"
    fields:
      - label: "Product Name"
        name: "name"
        widget: "string"
      - label: "Category"
        name: "category"
        widget: "string"
      - label: "Price"
        name: "price"
        widget: "string"
      - label: "Description"
        name: "description"
        widget: "text"
      - label: "Product Image"
        name: "image"
        widget: "image"
