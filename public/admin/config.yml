
backend:
  name: github
  repo: himcraftstudio-code/himcraftstudio-latest
  branch: main

media_folder: "public/images"
public_folder: "/images"

collections:
  - name: "products"
    label: "Products"
    files:
      - name: "product_data"
        label: "Product Data"
        file: "public/data/products.json"
        fields:
          - label: "Products"
            name: "products"
            widget: "list"
            fields:
              - label: "ID"
                name: "id"
                widget: "string"
              - label: "Product Name"
                name: "name"
                widget: "string"
              - label: "Category"
                name: "category"
                widget: "string"
              - label: "Price"
                name: "price"
                widget: "string"
              - label: "Description"
                name: "description"
                widget: "text"
              - label: "Product Image"
                name: "image"
                widget: "image"